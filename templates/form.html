
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма заявки</title>
</head>
<body>

<h1>Форма заявки</h1>

<form method="POST">

    <p>Имя:</p>
    <input type="text" name="name"
           value="{{ item.name if item else '' }}"
           required>

    <p>Описание:</p>
    <input type="text" name="description"
           value="{{ item.description if item else '' }}"
           required>

    <p>Категория:</p>
    <select name="category">
        <option value="Работа"
            {% if item and item.category == "Работа" %}
                selected
            {% endif %}>Работа</option>

        <option value="Учёба"
            {% if item and item.category == "Учёба" %}
                selected
            {% endif %}>Учёба</option>

        <option value="Личное"
            {% if item and item.category == "Личное" %}
                selected
            {% endif %}>Личное</option>
    </select>

    <p>Приоритет:</p>
    <select name="priority">
        <option value="Низкий"
            {% if item and item.priority == "Низкий" %}
                selected
            {% endif %}>Низкий</option>

        <option value="Средний"
            {% if item and item.priority == "Средний" %}
                selected
            {% endif %}>Средний</option>

        <option value="Высокий"
            {% if item and item.priority == "Высокий" %}
                selected
            {% endif %}>Высокий</option>
    </select>

    <p>
        <button type="submit">Сохранить</button>
    </p>

</form>

<a href="/">На главную</a>

</body>
</html>
