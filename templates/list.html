<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список заявок</title>
</head>
<body>

<h1>Список заявок</h1>

<a href="/">На главную</a>
<br><br>
<a href="/new">Создать заявку</a>

<br><br>

<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Категория</th>
        <th>Приоритет</th>
        <th>Действия</th>
    </tr>

    {% for item in requests %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.category }}</td>
        <td>{{ item.priority }}</td>
        <td>
            <a href="/view/{{ item.id }}">
                Просмотр
            </a>

            <a href="/edit/{{ item.id }}">
                Редактировать
            </a>

            <form action="/delete/{{ item.id }}"
                  method="POST">
                <button type="submit">
                    Удалить
                </button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

{% if not requests %}
    <p>Заявок пока нет.</p>
{% endif %}

</body>
</html>
