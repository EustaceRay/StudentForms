
---
- name: Deploy StudentForms Docker image
  hosts: webservers
  gather_facts: false

  vars:
    app_dir: /home/student/studentforms-deploy
    image_name: studentforms
    container_name: studentforms-app
    host_port: 5000

  tasks:
    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Docker image to server
      ansible.builtin.copy:
        src: "{{ image_archive }}"
        dest: "{{ app_dir }}/studentforms.tar"
        mode: "0644"

    - name: Load Docker image
      ansible.builtin.command:
        cmd: "docker load -i {{ app_dir }}/studentforms.tar"
      changed_when: true

    - name: Check existing container
      ansible.builtin.command:
        cmd: "docker container inspect {{ container_name }}"
      register: existing_container
      failed_when: false
      changed_when: false

    - name: Remove old container
      ansible.builtin.command:
        cmd: "docker rm -f {{ container_name }}"
      when: existing_container.rc == 0

    - name: Start new container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - "{{ container_name }}"
          - --restart
          - unless-stopped
          - -p
          - "{{ host_port }}:5000"
          - "{{ image_name }}:{{ image_tag }}"

    - name: Check application
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ host_port }}/"
        status_code: 200
      register: result
      retries: 10
      delay: 2
      until: result.status == 200

    - name: Remove transferred archive
      ansible.builtin.file:
        path: "{{ app_dir }}/studentforms.tar"
        state: absent
